name: M1 LibVanguard Linux tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    container: swift:6.4-noble
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Prepare result directory
        run: |
          mkdir -p artifacts
          printf '# M1 測試結果\n\n尚未開始測試。\n' > artifacts/results.md

      - name: Build and test LibVanguard
        shell: bash
        run: |
          set +e
          swift build --package-path upstream/Packages/vChewing_OSNeutral_LibVanguard \
            > artifacts/build.log 2>&1
          build_status=$?
          swift test --no-parallel \
            --package-path upstream/Packages/vChewing_OSNeutral_LibVanguard \
            --xunit-output artifacts/xunit.xml \
            > artifacts/test.log 2>&1
          test_status=$?
          set -e

          set +e
          swift - "$build_status" "$test_status" <<'SWIFT'
          import Foundation
          import FoundationXML
          import Glibc

          struct TestCaseResult {
            let name: String
            var failed = false
            var skipped = false
          }

          final class XUnitParser: NSObject, XMLParserDelegate {
            var cases: [TestCaseResult] = []
            private var current: TestCaseResult?

            func parser(
              _ parser: XMLParser,
              didStartElement elementName: String,
              namespaceURI: String?,
              qualifiedName qName: String?,
              attributes: [String: String] = [:]
            ) {
              switch elementName {
              case "testcase":
                let className = attributes["classname"] ?? ""
                let name = attributes["name"] ?? "(未命名測試)"
                current = TestCaseResult(name: [className, name].filter { !$0.isEmpty }.joined(separator: "."))
              case "failure", "error":
                current?.failed = true
              case "skipped":
                current?.skipped = true
              default:
                break
              }
            }

            func parser(
              _ parser: XMLParser,
              didEndElement elementName: String,
              namespaceURI: String?,
              qualifiedName qName: String?
            ) {
              guard elementName == "testcase", let current else { return }
              cases.append(current)
              self.current = nil
            }
          }

          let arguments = CommandLine.arguments
          let buildStatus = Int(arguments[1])!
          let testStatus = Int(arguments[2])!
          let resultURL = URL(fileURLWithPath: "artifacts/results.md")
          let artifactsURL = URL(fileURLWithPath: "artifacts")
          let xmlURLs = (try? FileManager.default.contentsOfDirectory(
            at: artifactsURL,
            includingPropertiesForKeys: nil
          ))?
            .filter { $0.lastPathComponent.hasPrefix("xunit") && $0.pathExtension == "xml" }
            .sorted { $0.lastPathComponent < $1.lastPathComponent } ?? []
          var allCases: [TestCaseResult] = []
          var parseErrors: [String] = []

          for xmlURL in xmlURLs {
            let delegate = XUnitParser()
            let parser = XMLParser(contentsOf: xmlURL)
            parser?.delegate = delegate
            if parser?.parse() == true {
              allCases += delegate.cases
            } else {
              let reason = parser?.parserError?.localizedDescription ?? "無法讀取 xUnit XML。"
              parseErrors.append("\(xmlURL.lastPathComponent)：\(reason)")
            }
          }

          if xmlURLs.isEmpty { parseErrors.append("swift test 未產生 xUnit XML。") }
          let parseError = parseErrors.isEmpty ? nil : parseErrors.joined(separator: "\n")
          let failedCases = allCases.filter(\.failed)
          let skippedCount = allCases.filter(\.skipped).count
          let passedCount = allCases.count - failedCases.count - skippedCount

          var lines = [
            "# M1 測試結果",
            "",
            "- `swift build` 結束碼：\(buildStatus)",
            "- `swift test --no-parallel` 結束碼：\(testStatus)",
            "- 通過數：\(parseError == nil ? String(passedCount) : "無法取得")",
            "- 失敗數：\(parseError == nil ? String(failedCases.count) : "無法取得")",
            "- 略過數：\(parseError == nil ? String(skippedCount) : "無法取得")",
            "",
            "## 失敗的測試",
            "",
          ]
          lines += failedCases.map { "- `\($0.name)`" }
          if failedCases.isEmpty { lines.append("- 無") }
          if let parseError { lines += ["", "xUnit 統計問題：\(parseError)"] }
          lines += [
            "",
            "完整輸出見 `build.log`、`test.log`；原始測試結果見 `xunit*.xml`。",
            "",
          ]
          try String(lines.joined(separator: "\n")).write(to: resultURL, atomically: true, encoding: .utf8)

          if parseError != nil { exit(1) }
          SWIFT
          report_status=$?
          set -e

          if [ "$build_status" -ne 0 ] || [ "$test_status" -ne 0 ] || [ "$report_status" -ne 0 ]; then
            exit 1
          fi

      - name: Install headless Fcitx test dependencies
        if: always()
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config libfcitx5core-dev libfcitx5config-dev \
            libfcitx5utils-dev fcitx5-modules-dev fcitx5 nlohmann-json3-dev

      - name: Test vg-repl and spelling golden
        if: always()
        shell: bash
        run: |
          swift test --no-parallel --package-path vg-repl \
            --xunit-output artifacts/vg-repl-xunit.xml \
            > artifacts/vg-repl-test.log 2>&1
          printf 's\nu\n3\n' \
            | swift run --package-path vg-repl --quiet vg-repl --layout dachen \
            > artifacts/vg-repl-golden.jsonl
          diff -u vg-repl/Tests/Fixtures/fcitx-su3.jsonl \
            artifacts/vg-repl-golden.jsonl

      - name: Debug and Release C ABI functions and output contract
        if: always()
        shell: bash
        run: |
          for configuration in debug release; do
            swift build --package-path vg-repl -c "$configuration" --product vgbridge \
              > "artifacts/vgbridge-$configuration-build.log" 2>&1
            bin_path="$(swift build --package-path vg-repl -c "$configuration" --show-bin-path)"
            clang -DNDEBUG -O2 -g -I vg-repl/Sources/VGBridge/include \
              vg-repl/Tests/c/test_vgbridge.c -L "$bin_path" -lvgbridge \
              -Wl,-rpath,"$bin_path" -o "/tmp/test_vgbridge-$configuration" \
              > "artifacts/vgbridge-$configuration-compile.log" 2>&1
            LD_LIBRARY_PATH="$bin_path" bash vg-repl/Tests/c/test_output_contract.sh \
              "/tmp/test_vgbridge-$configuration" vg-repl/Tests/Fixtures/fcitx-su3.jsonl \
              "artifacts/vgbridge-$configuration"
          done

      - name: Debug and Release headless Fcitx regression
        if: always()
        shell: bash
        run: |
          for configuration in Debug Release; do
            bin_path="$(swift build --package-path vg-repl -c "${configuration,,}" --show-bin-path)"
            bash vg-repl/scripts/test-headless.sh "$bin_path" \
              "artifacts/fcitx-$configuration" "$configuration"
          done

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-libvanguard-linux-results
          path: artifacts/
          if-no-files-found: warn

  memory:
    runs-on: ubuntu-latest
    container: swift:6.4-noble
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build fresh bridge for memory checks
        shell: bash
        run: |
          mkdir -p artifacts/memory
          swift build --package-path vg-repl --product vgbridge \
            > artifacts/memory/build.log 2>&1

      - name: Strict diagnostic and required narrow LSan check
        shell: bash
        run: |
          bin_path="$(swift build --package-path vg-repl --show-bin-path)"
          bash vg-repl/scripts/test-memory.sh "$bin_path" artifacts/memory \
            > artifacts/memory/result.log 2>&1

      - name: Publish memory verdicts
        if: always()
        shell: bash
        run: |
          if [ -f artifacts/memory/strict.exit ]; then
            strict_status="$(cat artifacts/memory/strict.exit)"
            printf 'Unsuppressed LSan exit: %s. Full diagnostics are uploaded.\n' "$strict_status" \
              >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f artifacts/memory/strict-classification.log ]; then
            cat artifacts/memory/strict-classification.log >> "$GITHUB_STEP_SUMMARY"
          fi
          printf 'The required check keeps detect_leaks=1 and excludes only ^CFRunArrayCreate$. Intentional malloc and bridge response leaks must still fail. The known Foundation leak remains unfixed.\n' \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload memory diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-memory-results
          path: artifacts/memory/
          if-no-files-found: warn

  package:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Ubuntu 24.04 amd64 package and matching sources
        shell: bash
        env:
          ZHUYINFLOW_PACKAGE_WORK: ${{ runner.temp }}/zhuyinflow-package
          ZHUYINFLOW_PACKAGE_OUTPUT: ${{ github.workspace }}/dist
          ZHUYINFLOW_VERSION: 0.1.0
        run: |
          build_log="$RUNNER_TEMP/zhuyinflow-package-build.log"
          trap 'mkdir -p artifacts; cp "$build_log" artifacts/package-build.log' EXIT
          bash packaging/build-deb.sh 2>&1 | tee "$build_log"
          (cd dist && sha256sum -c zhuyinflow_0.1.0_SHA256SUMS)

      - name: Verify package installation, installed code, and removal
        shell: bash
        run: |
          verify_work="$RUNNER_TEMP/zhuyinflow-package-verify"
          evidence="$GITHUB_WORKSPACE/artifacts/package-verify-evidence"
          mkdir -p "$evidence"
          collect_evidence() {
            verification_status=$?
            trap - EXIT
            collection_status=0
            for name in apt-update.log apt-install.log apt-remove.log \
              dpkg-verify.txt explicit-missing.log system-map.log personal-map.log \
              personal-invalid.log migration-check.log migration.log migration-backup.txt \
              installed-metadata.txt installed-files.txt installed-ldd.txt installed-elf.txt; do
              source_file="$verify_work/$name"
              if [ -f "$source_file" ] && [ ! -L "$source_file" ] && [ -r "$source_file" ]; then
                cp -- "$source_file" "$evidence/$name" || collection_status=1
              elif [ "$verification_status" -eq 0 ]; then
                printf 'Missing or unsafe verification evidence: %s\n' "$name" >&2 || collection_status=1
                collection_status=1
              fi
            done
            if [ "$verification_status" -eq 0 ]; then
              grep -Fx 'PACKAGE_INSTALL_LOADER_DICTIONARY_MIGRATION_REMOVE_OK' \
                artifacts/package-verify.log > "$evidence/result.txt" || collection_status=1
            fi
            printf '%s\n' "$verification_status" > "$evidence/verification.exit" || collection_status=1
            printf '%s\n' "$collection_status" > "$evidence/collection.exit" || collection_status=1
            if [ "$verification_status" -ne 0 ]; then exit "$verification_status"; fi
            exit "$collection_status"
          }
          # Copy fixed evidence only; isolated HOME/runtime state stays in RUNNER_TEMP.
          trap collect_evidence EXIT
          bash packaging/verify-deb.sh dist/zhuyinflow_0.1.0_amd64.deb \
            "$verify_work" \
            2>&1 | tee artifacts/package-verify.log

      - name: Check every package artifact before upload
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, hashlib, json, pathlib, stat
          patterns = ["dist/*.deb", "dist/*_sources.tar.xz", "dist/*_SHA256SUMS",
                      "artifacts/package-*.log", "artifacts/package-verify-evidence/*"]
          files = sorted({pathlib.Path(p) for pattern in patterns for p in glob.glob(pattern)})
          assert all(glob.glob(pattern) for pattern in patterns), "Missing artifact group"
          records = []
          for path in files:
              assert stat.S_ISREG(path.lstat().st_mode), f"Non-regular artifact: {path}"
              digest = hashlib.sha256()
              with path.open("rb") as stream:
                  for block in iter(lambda: stream.read(1024 * 1024), b""):
                      digest.update(block)
              records.append({"path": str(path), "sha256": digest.hexdigest()})
          pathlib.Path("artifacts/package-upload-manifest.json").write_text(
              json.dumps(records, indent=2) + "\n")
          PY

      - name: Upload installable package, sources, and verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zhuyinflow-ubuntu-24.04-amd64
          path: |
            dist/*.deb
            dist/*_sources.tar.xz
            dist/*_SHA256SUMS
            artifacts/package-*.log
            artifacts/package-verify-evidence/
            artifacts/package-upload-manifest.json
          if-no-files-found: warn
